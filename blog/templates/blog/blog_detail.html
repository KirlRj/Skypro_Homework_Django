{% extends 'base.html' %}

{% block content %}
<h1>{{ blog.title }}</h1>
<p>Создано: {{ blog.created_at }}</p>
<p>Просмотров: {{ blog.views_count }}</p>
{% if blog.image %}
    <img src="{{ blog.image.url }}" alt="{{ blog.title }}">
{% endif %}
<p>{{ blog.content|linebreaks }}</p>
<a href="{% url 'blog:list' %}">Назад</a>
<a href="{% url 'blog:update' blog.pk %}">Редактировать</a>
<a href="{% url 'blog:delete' blog.pk %}">Удалить</a>
{% endblock %}
