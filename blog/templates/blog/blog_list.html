{% extends 'base.html' %}

{% block content %}
<h1>Блог</h1>
<a href="{% url 'blog:create' %}">Создать запись</a>

{% for blog in blogs %}
<div>
    <h2>{{ blog.title }}</h2>
    <p>{{ blog.content|truncatewords:30 }}</p>
    <a href="{% url 'blog:detail' blog.pk %}">Подробнее</a>
</div>
{% endfor %}
{% endblock %}
