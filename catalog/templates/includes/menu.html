<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">
        <a href="{% url 'catalog:home' %}" class="text-decoration-none text-dark">Skystore</a>
    </h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
           href="{% url 'catalog:home' %}">
            Каталог
        </a>
        <a class="p-2 btn btn-outline-primary {% if request.resolver_match.url_name == 'contacts' %}active{% endif %}"
           href="{% url 'catalog:contacts' %}">
            Контакты
        </a>
    </nav>
    <div class="ms-auto">
        {% if user.is_authenticated %}
            <span class="ms-2 text-muted">{{ user.email }}</span>
            <form method="post" action="{% url 'users:logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger ms-2">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'users:register' %}" class="btn btn-outline-success ms-2">Регистрация</a>
            <a href="{% url 'users:login' %}" class="btn btn-outline-primary ms-2">Войти</a>
        {% endif %}
    </div>
</div>
</div>
